[package]
name = "vusi-engine"
version = "0.2.0"
edition = "2021"
description = "Analysis engine wrapping the vusi library for the vusi GUI"
license = "MIT"

[dependencies]
vusi = { path = "..", features = ["polynonce"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Bitcoin transaction → (r, s, z) extraction
sha2 = "0.10"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
# Used to verify each extracted signature against the computed sighash, so we
# know the z we produced is correct.
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }

[features]
# The lattice-based biased-nonce attack pulls in `rug` (GMP/MPFR). On by
# default; disable with `--no-default-features` if GMP isn't available.
default = ["biased-nonce"]
biased-nonce = ["vusi/biased-nonce"]
